workflows:
  ios-unsigned-ipa:
    name: "Rayo Tracking - Unsigned IPA"
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.rayo.transtrack

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build unsigned iOS Release App
        script: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        script: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -rq RayoTracking-unsigned.ipa Payload
          rm -rf Payload
          mkdir -p ios/ipa
          mv RayoTracking-unsigned.ipa ios/ipa/
          echo "Unsigned IPA successfully created at build/ios/ipa/RayoTracking-unsigned.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - rayo.trans09@gmail.com
        notify:
          success: true
          failure: true
